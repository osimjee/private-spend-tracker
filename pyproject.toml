[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "private-spend-tracker"
version = "1.3.0"
description = "Local-only spending tracker: scrubs bank statements on your computer, categorizes spending and builds an offline budget dashboard."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
dependencies = []
keywords = ["budget", "privacy", "personal-finance", "local-first", "claude-skill"]

[project.optional-dependencies]
pdf = ["pdfplumber"]

[project.scripts]
spendscan = "private_spend_tracker.spendscan:main"

[tool.setuptools]
packages = ["private_spend_tracker"]

[tool.setuptools.package-data]
private_spend_tracker = ["dashboard_template.html"]
